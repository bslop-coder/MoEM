name: GemmaEdge
options:
  bundleIdPrefix: com.gemmaedge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    CLANG_ENABLE_EXPLICIT_MODULES: NO

targets:
  GemmaEdge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Engine
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gemmaedge.app
        PRODUCT_NAME: GemmaEdge
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Engine/Include/GemmaEdge-Bridging-Header.h
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
        CLANG_ENABLE_EXPLICIT_MODULES: NO
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        CLANG_ENABLE_MODULES: YES
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Engine"
          - "$(PROJECT_DIR)/Engine/Include"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - framework: Vendor/llama.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: Accelerate.framework
